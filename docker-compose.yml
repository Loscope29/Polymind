services:
  polymind:
    build: .
    image: polymind:latest
    container_name: polymind
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      # Conserve les modèles téléchargés (Whisper, MMS-TTS, MiniLM, Chronos) entre les redémarrages
      - model-cache:/home/app/.cache
    restart: unless-stopped

volumes:
  model-cache:
